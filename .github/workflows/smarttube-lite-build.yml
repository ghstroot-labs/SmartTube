name: SmartTube Lite - Android Build

on:
  push:
    branches:
      - feature/player-performance

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout com submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configurar Java 17 para Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Instalar dependencias Android
        run: |
          sdkmanager \
            "platforms;android-34" \
            "build-tools;30.0.3" \
            "ndk;21.0.6113669"

      - name: Verificar Android SDK e submodulos
        run: |
          test -f SharedModules/core_settings.gradle
          test -f MediaServiceCore/core_settings.gradle
          test -f exoplayer-amzn-2.10.6/core_settings.gradle
          sdkmanager --list_installed

      - name: Configurar Java 11 para Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Compilar APK de teste
        run: |
          java -version
          chmod +x ./gradlew
          ./gradlew :smarttubetv:assembleStstableDebug \
            --no-daemon --stacktrace

      - name: Publicar artefatos de teste
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smarttube-lite-debug
          path: smarttubetv/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
