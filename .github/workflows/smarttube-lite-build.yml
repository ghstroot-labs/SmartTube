name: SmartTube Lite - Android Build

on:
  push:
    branches:
      - feature/player-performance
    paths:
      - ".github/workflows/smarttube-lite-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout com submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configurar Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias Android
        run: |
          sdkmanager \
            "platforms;android-34" \
            "build-tools;30.0.3" \
            "ndk;21.0.6113669"

      - name: Compilar APK de teste
        run: |
          chmod +x ./gradlew
          ./gradlew :smarttubetv:assembleStstableDebug \
            --no-daemon --stacktrace

      - name: Publicar artefatos de teste
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smarttube-lite-debug
          path: smarttubetv/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
